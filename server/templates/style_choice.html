{% extends "base.html" %}

{% block css %}

<style>
    .btn-secondary.active, .btn-secondary:active {
        color: white !important;
        background: #00BEFF !important;
        border-color: #00BEFF !important;
    }
    .header {
        position:absolute;
        top: 0px;
        width: 80%;
        height: 3%;
        text-align: right;
        padding-right: 10px;
        }
</style>

{% end %}

{% block scripts %}
<script>
    function validate_form() {
        var elements = document.getElementById("survey_form").elements;
        for (var i = 0, element; element = elements[i++];) {
            if (element.type == "radio"){
            var valid = element.checkValidity()
            if (!valid){
                var table = document.getElementById(element.name + '_table');
                // Handles the additional questions which are hidden and optional
                if (table){
                table.style.borderStyle = 'dotted';
                table.style.borderWidth = '2px';
                table.style.borderColor = 'red';
                };
            }
            }
            else if (element.type == "textarea"){
            var valid = element.checkValidity()
            if (!valid){
                element.style.borderStyle = 'solid';
                element.style.borderColor = 'red';
            }
            else {
                element.style.borderColor = 'grey';
            }
            };
        };
    };
    </script> 

{% end %}

{% block content %}
<div class="container">
    <!-- <h1 class="mb-4 mt-4">Pre-Survey</h1> -->
    <form id="survey_form" onsubmit="return submit_form(event)" method="POST" action="/log_style_survey">
     
        <div class="card mt-5 mb-3">
            <div class="card-header">
                <h4>Expectations of Chatbots</h4>
            </div>
            <div class="card-body">           
                <h6>Please select the template that you would find most appropriate for a chatbot:</h6>
                <br/>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="best_template" id="best_template1" value="0" required>
                    <label class="form-check-label" for="best_template1">{{ style1 }}</label>
                </div>
                <br/>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="best_template" id="best_template2" value="1" required>
                    <label class="form-check-label" for="best_template2">{{ style2 }}</label>
                </div>
                <br/>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="best_template" id="best_template3" value="2" required>
                    <label class="form-check-label" for="best_template3">{{ style3 }}</label>
                </div>
                <br/>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="best_template" id="best_template4" value="3" required>
                    <label class="form-check-label" for="best_template4">{{ style4 }}</label>
                </div>
                
            </div>
        </div>

        

        <button type="submit" class="btn btn-success mb-4" onclick="validate_form()">Submit</button>
    </form>
    <div class="header">
        <a href="https://www.uni-stuttgart.de/impressum/">Impressum</a>
    </div> 
</div>
{% end %}
